<html>
	<head>
		<link rel="stylesheet" type="text/css" href="style.css">
		<link href="https://fonts.googleapis.com/css?family=Open+Sans:600,700" rel="stylesheet">
		<title>A simple calculator</title>
	</head>
	<body>
		<div id="container">
			<div id="calculator">
				<div id="result">
					<div id="history">
						<p id="history-value"></p>
					</div>
					<div id="output">
						<p id="output-value"></p>
					</div>
				</div>
				<div id="keyboard">
					<button class="operator" id="clear">C</button>
					<button class="operator" id="backspace">CE</button>
					<button class="operator" id="%">&percnt;</button>
					<button class="operator" id="/">\u00f7</button>
					<button class="operator" id="sin">sin</button>
					<button class="operator" id="cos">cos</button>
					<button class="operator" id="tan">tan</button>
					<button class="operator" id="*">&times;</button>
					<button class="number" id="7">7</button>
					<button class="number" id="8">8</button>
					<button class="number" id="9">9</button>
					<button class="operator" id="asin">asin</button>
					<button class="operator" id="acos">acos</button>
					<button class="operator" id="atan">atan</button>
					<button class="operator" id="-">-</button>
					<button class="number" id="4">4</button>
					<button class="number" id="5">5</button>
					<button class="number" id="6">6</button>
					<button class="operator" id="log">log</button>
					<button class="operator" id="ln">ln</button>
					<button class="operator" id="exp">exp</button>
					<button class="operator" id="+">+</button>
					<button class="number" id="1">1</button>
					<button class="number" id="2">2</button>
					<button class="number" id="3">3</button>
					<button class="operator" id="sqrt">sqrt</button>
					<button class="operator" id="x2">x\u00b2</button>
					<button class="operator" id="x3">x\u00b3</button>
					<button class="operator" id="x^y">x^y</button>
					<button class="operator" id="pi">\u03c0</button>
					<button class="operator" id="e">e</button>
					<button class="operator" id="(">\u0028</button>
					<button class="operator" id=")">\u0029</button>
					<button class="operator" id="mode">rad</button>
					<button class="number" id="0">0</button>
					<button class="operator" id="fact">!</button>
					<button class="operator" id="=">=</button>
				</div>
			</div>
		</div>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.1/math.min.js"></script>
		<script src="script.js"></script>
	</body>
</html>
